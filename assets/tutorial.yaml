- title: Getting started
  intro: >
    Thanks for playing the Unnamed Orbits Game/Space Fedex 2025.

    This tutorial should walk you through the basics of spaceflight.

    Let's start by selecting a vehicle.
  conditions:
    - cond: !SelectVehicle 1003
      is_permanent: false
      seconds: 0

  ending: |
    Great job! This vehicle will be referred to as the "ownship" further
    along in the tutorial.

    The HUD that appeared on the bottom right of the screen displays
    vehicle-specific info, like your heading, vehicle class, current mode, etc.
    This is called the "Control Panel".

    FYI: You can move between chapters of the tutorial with K and L.

    Let's zoom in on this spacecraft to get a closer look.

# ====================================================================

- title: Controlling the camera
  intro: |
    The camera can be translated around with WASD.
    Zoom in and out with [+] and [-], or using the mouse scroll wheel.

    Additionally, you can tell the camera to go to a particular vessel by
    ctrl+left-clicking the vessel of interest.

    Let's zoom in on a particular ship to see what it looks like up close.
  conditions:
    - cond: !SelectVehicle 1003
      is_permanent: false
      seconds: 0
    - cond: !FocusCamera 1003
      is_permanent: false
      seconds: 0
    - cond: !ZoomCamera
      is_permanent: false
      seconds: 0

  ending: |
    Very cool. Now let's learn how to control a spacecraft.

# ====================================================================

- title: Thrust Control
  intro: |
    Once a vehicle is selected, you can control it using the arrow keys.
    The up arrow key will enable the thrusters located in the rear of the
    ship, which will drive the vessel "forwards".

    Conversely, the down arrow key will activate the thrusters located on the
    front of the ship (if it has any), sending the vessel "backwards".

    In short, UP is FORWARDS, DOWN is BACKWARDS.

    Since vessels can rotate freely, you'll need to keep track of which way
    your ownship is pointing - this is indicated by the green arrow on the
    Control Panel.

  conditions:
    - cond: !SelectVehicle 1003
      is_permanent: false
      seconds: 0
    - cond: !ThrustForward 1003
      is_permanent: true
      seconds: 5
    - cond: !ThrustBackward 1003
      is_permanent: true
      seconds: 5

  ending: |
    Fabulous. Most vessels won't be able to thrust both forwards and backwards;
    this one is special.

    Now let's correct that spin.

# ====================================================================

- title: Attitude Control
  intro: |
    You might notice your vessel is spinning. This makes maneuvering difficult;
    we want to be able to control which way the craft is pointing so that we
    can thrust in different directions.

    You can change your vehicle's rotation rate using the left and right arrow
    keys. The HEADING and RATE indicators on the Control Panel show which way
    the vessel is pointing and how fast it's spinning.

    We'll use a larger vessel that's slower to turn, so it's easier to
    make precise changes manually. Press H to return to the orbital view and
    select another vessel.

  conditions:
    - cond: !SelectVehicle 1006
      is_permanent: false
      seconds: 0
    - cond: !FocusCamera 1006
      is_permanent: false
      seconds: 0
    - cond: !ZoomCamera
      is_permanent: false
      seconds: 0
    - cond: !HoldAttitude
        - 1006
        - 240
      is_permanent: true
      seconds: 5
    - cond: !HoldAttitude
        - 1006
        - 120
      is_permanent: true
      seconds: 5
    - cond: !HoldAttitude
        - 1006
        - 175
      is_permanent: true
      seconds: 5
    - cond: !HoldAttitude
        - 1006
        - 320
      is_permanent: true
      seconds: 5

  ending: |
    Heckin sweet. Let's make some orbital maneuvers.

# ====================================================================

- title: Prograde and Retrograde
  intro: |
    Prograde and retrograde are two of the most fundamental directions
    in orbital mechanics. Vessels are equipped with the ability to
    execute maneuvers in those directions automatically.

    "Prograde" means "along the vehicle's direction of travel".

    "Retrograde" means "opposite the vehicle's direction of travel".

    In space, prograde is nearly the same thing as forwards, and retrograde
    is close enough to the idea of backwards. There are important differences
    (for example, spacecraft can point in other directions than their
    direction of travel - they're not cars!) but that's a close enough
    mental model to start with.

  conditions:
    - cond: !SelectVehicle 1004
      is_permanent: false
      seconds: 0
    - cond: !Prograde 1004
      is_permanent: true
      seconds: 30
    - cond: !Retrograde 1004
      is_permanent: true
      seconds: 30
    - cond: !Idle 1004
      is_permanent: false
      seconds: 0
  ending: |
    Good job!

# ====================================================================

- title: Raising your apoapsis
  intro: |
    This is the first half of raising your orbit - thrust prograde and
    raise your apoapsis to the desired altitude.

    TODO make this better and explain what apoapses are.
  conditions:
    - cond: !SelectVehicle 1004
      is_permanent: false
      seconds: 0
    - cond: !Prograde 1004
      is_permanent: true
      seconds: 10
    - cond: !Apoapsis
        - 1004
        - 64000000
        - 67000000
      is_permanent: false
      seconds: 10
    - cond: !Idle 1004
      is_permanent: false
      seconds: 0
  ending: |
    Yay!

# ====================================================================

