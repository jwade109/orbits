        vehicle_id: 1004
        planet_id: 901
        rp: 10000000
        ra: 23000000
        argp: -0.4
        tol: 1000000
      is_permanent: false
      seconds: 10
  ending: |
    Yay!

# ====================================================================

- title: Selecting a target
  intro: |
    We want to dock two vehicles together, so they can exchange
    cargo and fuel with each other.

    Designating another vehicle as a target is useful for performing orbital
    rendezvous. This will display relative positioning info which can be
    used to maneuver into an intercept with the target.
  conditions:
    - cond: !SelectVehicle 1005
      is_permanent: false
      seconds: 0
    - cond: !SetTarget
        ownship: 1005
        target: 1002
      is_permanent: false
      seconds: 0
  ending: |
    Cool! The red line on the screen indicates the ownship's future position
    relative to its target. Places where the red line passes next to the
    target are approaches, which we'll tune in order to perform the rendezvous.

# ====================================================================

- title: Draw the rest of the owl
  intro: >
    I know you just started, but you're so ready for this.
  conditions:
    - cond: !SelectVehicle 1004
      is_permanent: false
      seconds: 0
    - cond: !SetTarget
        ownship: 1004
        target: 1002
      is_permanent: false
      seconds: 0
    - cond: !Rendezvous
        ownship: 1004
        target: 1002
      is_permanent: false
      seconds: 10
  ending: |
    You freaking did it!
