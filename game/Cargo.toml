[package]
name = "game"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.16.0" }
bevy-inspector-egui = "0.33.1"
bevy_ecs = "0.16.1"
bevy_egui = "0.36.0"
bevy_math = "0.16.1"
bevy_pancam = "0.18.0"
bevy_render = "0.16.1"
bevy_vector_shapes = "0.10.0"
chrono = "0.4.39"
lazy_static = "1.5.0"
rand = "0.9.2"
rand_chacha = "0.3.1"
names = "0.14.0"
rfd = "0.15.3"
enum-iterator = "2.1.0"
serde_yaml = "0.9.34"
serde = "1.0.219"
clap = { version = "4.5.38", features = ["derive"] }
image = "0.25.6"
project-root = "0.2.2"
compile-time = "0.2.0"
textwrap = "0.16.2"
shellwords = "1.1.0"
big_space = { version = "0.10.0", features = ["bevy_input", "bevy_render", "bevy_time", "camera", "debug", "i128", "i16", "i32", "i64", "i8", "libm"] }
avian2d = "0.3.1"
turborand = "0.10.1"
bevy_fly_camera = "0.16.0"
bevy_window = "0.16.1"
egui = "0.32.3"
egui_dock = "0.17.0"
bevy_light_2d = "0.7.0"
svg = "0.18.0"
splines = "5.0.0"
glam = { version = "0.30.9", features = ["serde"] }
assert_float_eq = "1.2.0"
approx = "0.5.1"
more-asserts = "0.3.1"
lsystem = "0.2.1"
noise = "0.9.0"
rootfinder = "0.4.1"

[[bin]]
name = "ship_editor"
path = "bin/game.rs"

[[bin]]
name = "big"
path = "bin/big.rs"

[[bin]]
name = "egui"
path = "bin/egui.rs"

[[bin]]
name = "ship2png"
path = "bin/ship2png.rs"

[[bin]]
name = "propsim"
path = "bin/propsim.rs"
