[package]
name = "bary_raylib"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.0"
raylib = "5.5.1"
bary_core = { path = "../bary_core" }
rdev = "0.5.3"
crossbeam-queue = "0.3.12"
rapier2d = "0.32.0"
enum-iterator = "2.3.0"
steamworks = "0.12.2"
renet = "2.0.0"
renet_netcode = "2.0.0"
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3.3"
log = "0.4.29"
env_logger = "0.11.9"
simple_logger = "5.2.0"

[[bin]]
name = "main"
path = "bin/main.rs"

[[bin]]
name = "kb"
path = "bin/kb.rs"

[[bin]]
name = "rapier"
path = "bin/rapier.rs"

[[bin]]
name = "steam"
path = "bin/steam.rs"

[[bin]]
name = "server"
path = "bin/server.rs"

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "my_benchmark"
harness = false
