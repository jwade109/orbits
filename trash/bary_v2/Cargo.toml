[package]
name = "bary_v2"
version = "0.1.0"
edition = "2024"
default-run = "game"

[dependencies]
chrono = "0.4.39"
lazy_static = "1.5.0"
rand = "0.9.2"
rand_chacha = "0.3.1"
bary_core = { path = "../bary_core" }
bary_v1 = { path = "../bary_v1" }
names = "0.14.0"
rfd = "0.15.3"
enum-iterator = "2.1.0"
serde_yaml = "0.9.34"
serde = "1.0.219"
clap = { version = "4.5.38", features = ["derive"] }
image = "0.25.6"
project-root = "0.2.2"
compile-time = "0.2.0"
textwrap = "0.16.2"
shellwords = "1.1.0"
turborand = "0.10.1"
noise = "0.9.0"
early_returns = "0.4.0"
egui = "0.33.3"
bevy = "0.18.0"

[[bin]]
name = "game"
path = "bin/main.rs"
