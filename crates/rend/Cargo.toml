[package]
name = "rend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
glfw = "0.59.0"
wgpu = "23.0.1"
pollster = "0.4.0"
glm = "*"
num-traits = "0.2.19"
clap = { version = "4.6.2", features = ["derive"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
enum-iterator = "2.3.0"
regex = "1.13.1"
noise = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rand = "0.10.2"
kira = "0.12.2"

[dependencies.image]
version = "0.25.5"
features = ["png", "jpeg"]

